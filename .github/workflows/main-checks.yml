name: Main checks

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ayinou-main-checks
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: TypeScript, lint and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0 # L5 source integrity and S1 review checks use historical baselines.
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.18.0"
          cache: npm
      - run: npm ci --no-audit
      - name: Check TypeScript
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check shared contracts, translations, API and client behavior
        run: npm test
      - name: Validate engineering standards and review evidence
        run: npm run test:standards
      - name: Validate legal publication boundary and L5 source integrity
        run: |
          npm run test:legal-center
          python scripts/test-validate-legal-l5.py
          python scripts/validate-legal-l5.py

  build:
    name: Production builds and dependencies
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.18.0"
          cache: npm
      - run: npm ci --no-audit
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Build API and web
        run: npm run build:local

  browser:
    name: Chromium smoke with disposable Supabase
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.18.0"
          cache: npm
      - run: npm ci --no-audit
      - name: Install Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Run isolated smoke tests
        run: npm run test:e2e:smoke
      - name: Prepare browser result counts
        if: always()
        run: |
          node --input-type=module <<'JS'
          import { existsSync, readFileSync, writeFileSync } from "node:fs";
          const path = "apps/web/e2e-results/report.json";
          if (existsSync(path)) {
            const { stats } = JSON.parse(readFileSync(path, "utf8"));
            writeFileSync("browser-summary.json", JSON.stringify(stats, null, 2) + "\n");
          }
          JS
      - name: Retain browser result counts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chromium-result-counts
          path: browser-summary.json
          if-no-files-found: ignore
          retention-days: 3
      - name: Verify development signup with email confirmation disabled
        run: npm run test:e2e -- --without-signup-confirmation immediate-signup.spec.ts
